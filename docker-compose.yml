services:
  postgres:
    image: postgres:16
    container_name: visasim-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: visasim
      POSTGRES_USER: visasim
      POSTGRES_PASSWORD: visasim_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: visasim-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      # IMPORTANT:
      # Containers connect using kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7.4
    container_name: visasim-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile

    container_name: visasim-user-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      # PostgreSQL → Docker service name
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/visasim
      SPRING_DATASOURCE_USERNAME: visasim
      SPRING_DATASOURCE_PASSWORD: visasim_dev_password

      # Kafka → Docker service name
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Redis → Docker service name
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      - postgres
      - kafka
      - redis

volumes:
  postgres_data:
