version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: visasim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: visasim
      POSTGRES_USER: visasim
      POSTGRES_PASSWORD: visasim_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
